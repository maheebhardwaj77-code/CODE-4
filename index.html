<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html file</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,body{
            width: 100%;
            height: 100%;
        }

        #main{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }

        #main input{
            display: none;
        }

        #main #btn{
            color: white;
            background-color: rgb(31, 126, 126);
            padding: 8px 10px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 500;
            user-select: none;
        }

        #main #btn:hover {
            background-color: rgb(24, 99, 99);
            font-size: 23px;
        }

    </style>
</head>
<body>
    <div id="main">
        <input id="file" type="file">
        <div id="btn">upload file</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
