<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html file</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html,body{
    width: 100%;
    height: 100%;
}

#main{
    padding: 50px;
    width: 100%;
    height: 100%;
    background-color: #222;
}

input{
    display: block;
    font-size: 18px;
}

.card {
    max-width: 300px;
    margin-top: 40px;
    display: inline-block;
    padding: 20px;
    border: 1px solid #333;
    border-radius: 10px;
    color: white;
}

.profile {
    width: 70px;
    height: 70px;
    border-radius: 50%;
}

.profile img{
    width: 70px;
    height: 70px;
    border-radius: 50%;
    zoom: normal;
}
.card h2{
    margin-top: 10px;
}

.card h4{
    margin-top: 5px;
}   

.card h5{
    margin-top: 10px;
}
    </style>
</head>
<body>
     <div id="main">
        <form action="">
            <input type="text" placeholder="profile pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="profession">
            <input type="text" placeholder="e-mail">
            <input type="submit">
        </form>
     </div>
    <script src="script.js"></script>
</body>
</html>
