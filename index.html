<!DOCTYPE html>
<html>
<head>
  <title>Password Toggle</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    .box {
      width: 350px;
      margin: auto;
    }

    input {
      width: 220px;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Password</h1>

    <input type="password" id="password" placeholder="Enter password">

    <button id="toggle">Show</button>

  </div>

  <script src="script.js"></script>

</body>
</html>
